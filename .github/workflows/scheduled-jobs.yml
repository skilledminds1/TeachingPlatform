# MANUAL job runner. THE SCHEDULER IS pg_cron — see
# prisma/migrations/20260809120000_scheduled_jobs_on_pg_cron and scripts/setup-pg-cron.ts.
#
# This held the schedule until 9 August 2026. The jobs lived in vercel.json before that, until
# Vercel's Hobby tier refused any cron more frequent than daily and rejected the whole
# DEPLOYMENT over it. Actions was the answer, and it was the wrong one for a different reason:
# GitHub delivers scheduled workflows on a best-effort basis and drops them under load. The
# measured gaps between consecutive runs of the */5 schedule were 44, 16 and then 51+ minutes,
# against staleness thresholds allowing fifteen minutes of jitter. A five-minute email queue
# drained every fifty-one minutes is not a five-minute email queue, and readiness sat red
# saying exactly that.
#
# pg_cron fires from inside the database that is already the system of record, with no runner
# queue to wait behind.
#
# The `schedule:` triggers are GONE rather than commented out. Two schedulers aimed at the same
# routes would double every tick, and a commented-out block is how the unreliable one gets
# switched back on by accident. A test asserts their absence.
#
# What remains is worth keeping: running one job, or all of them, by hand.
#
# REQUIRED CONFIGURATION (repository Settings):
#   Secrets  → CRON_SECRET          the same value as the deployment's CRON_SECRET
#   Variables → PRODUCTION_APP_URL   e.g. https://www.amazing-skills.com (no trailing slash)
name: Scheduled jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job name to run, or "all"'
        required: false
        default: all
        type: string

permissions:
  contents: read

# One queued run at most. The routes claim their own work, so an overlap is safe rather than
# harmful, but stacking runs behind a slow one only delays the recovery.
concurrency:
  group: scheduled-jobs-${{ inputs.job }}
  cancel-in-progress: false

env:
  # The dispatchable jobs. Schedules are NOT here any more — pg_cron holds those, derived from
  # src/server/jobs/registry.ts by scripts/setup-pg-cron.ts. A test asserts this list still
  # matches the registry, so a job added there stays runnable by hand.
  JOB_NAMES: '["session-reminders","expire-booking-requests","finalize-sessions","refresh-fx-rates","subscription-lifecycle","process-email-outbox"]'

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configuration
        env:
          APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          [ -n "$APP_URL" ] || missing="$missing PRODUCTION_APP_URL(variable)"
          [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured, so every scheduled job would silently do nothing. Missing:$missing"
            exit 1
          fi

      - name: Invoke
        env:
          APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REQUESTED: ${{ inputs.job }}
        run: |
          # Deliberately no `set -e`: every job is attempted even after one fails, and the
          # step fails at the end. Stopping at the first error would let one broken endpoint
          # hide the health of every job sharing its schedule.
          set -uo pipefail

          if [ -n "${REQUESTED:-}" ] && [ "$REQUESTED" != "all" ]; then
            jobs="$REQUESTED"
          else
            jobs=$(printf '%s' "$JOB_NAMES" | jq -r '.[]')
          fi

          if [ -z "$jobs" ]; then
            echo "::error::No job to run — '${REQUESTED:-}' matches nothing in JOB_NAMES"
            exit 1
          fi

          failed=0
          for job in $jobs; do
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/v1/jobs/$job") || code="000"
            summary=$(head -c 400 "$body")
            if [ "$code" = "200" ]; then
              echo "ok    $job  $summary"
            else
              # 401 means CRON_SECRET does not match, and the route records no check-in for
              # it — by design, so the monitoring cannot confirm the outage it exists to catch.
              echo "::error::$job returned HTTP $code — $summary"
              failed=1
            fi
            rm -f "$body"
          done
          exit $failed
